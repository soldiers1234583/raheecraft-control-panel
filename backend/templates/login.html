<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RaheeCraft - Login</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="4" y="4" width="24" height="24" rx="4" fill="currentColor" fill-opacity="0.2"/>
                        <path d="M8 12h16M8 16h12M8 20h8" stroke="currentColor" stroke-linecap="round"/>
                    </svg>
                </div>
                <h1>RaheeCraft</h1>
                <p>Server Control Panel</p>
            </div>
            
            <!-- method="post": the fallback path must never send the password
                 in a URL. The script below intercepts submit and uses the API. -->
            <form id="login-form" class="auth-form" method="post" action="/login">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                
                <div id="error-message" class="error-message" style="display: none;"></div>
                
                <button type="submit" class="btn btn-primary">
                    <span class="btn-text">Sign In</span>
                    <span class="spinner"></span>
                </button>
            </form>
            
            <div class="auth-footer">
                <p class="hint">Enter admin credentials to access the panel</p>
            </div>
        </div>
    </div>
    
    <script src="/static/js/auth.js"></script>
    <script>
    (function () {
        const form = document.getElementById('login-form');
        const errorBox = document.getElementById('error-message');
        const button = form.querySelector('button[type="submit"]');

        function showError(message) {
            errorBox.textContent = message;
            errorBox.style.display = 'block';
        }

        // A failed server-side (no-JavaScript) login redirects here with
        // error=1 — say so instead of leaving a blank form.
        const reason = new URLSearchParams(window.location.search).get('error');
        if (reason === '1') showError('Invalid username or password');
        else if (reason === 'ratelimited') showError('Too many attempts. Wait a minute and try again.');
        else if (reason) showError('Sign-in failed. Try again.');

        form.addEventListener('submit', async function (event) {
            event.preventDefault();
            errorBox.style.display = 'none';
            button.disabled = true;
            const result = await Auth.login(
                document.getElementById('username').value,
                document.getElementById('password').value);
            button.disabled = false;
            if (result.success) {
                window.location.href = '/';
                return;
            }
            showError(result.error || 'Login failed');
        });
    })();
    </script>
</body>
</html>
