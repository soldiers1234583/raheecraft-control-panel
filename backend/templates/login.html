<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RaheeCraft - Login</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="4" y="4" width="24" height="24" rx="4" fill="currentColor" fill-opacity="0.2"/>
                        <path d="M8 12h16M8 16h12M8 20h8" stroke="currentColor" stroke-linecap="round"/>
                    </svg>
                </div>
                <h1>RaheeCraft</h1>
                <p>Server Control Panel</p>
            </div>
            
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                
                <div id="error-message" class="error-message" style="display: none;"></div>
                
                <button type="submit" class="btn btn-primary">
                    <span class="btn-text">Sign In</span>
                    <span class="spinner"></span>
                </button>
            </form>
            
            <div class="auth-footer">
                <p class="hint">Enter admin credentials to access the panel</p>
            </div>
        </div>
    </div>
    
    <script src="/static/js/auth.js"></script>
</body>
</html>
