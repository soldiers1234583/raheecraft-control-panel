# RaheeCraft Control Panel - Render Deployment
# https://render.com/dashboard/new?type=web

services:
  - type: web
    name: raheecraft-control-panel
    env: python
    plan: free
    
    # Build command - install dependencies
    buildCommand: "pip install -r backend/requirements.txt"
    
    # Start command - run the backend
    startCommand: "python backend/app.py"
    
    # Environment variables (set in Render dashboard, NOT in this file)
    # - SECRET_KEY: Session signing key (auto-generated if not set)
    # - ADMIN_PASSWORD: Admin login password
    # - BACKEND_URL: (for agent communication, set if needed)
    
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8080
      - key: DEBUG
        value: false
      - key: SESSION_SECURE
        value: true
    
    # Routes
    routes:
      - type: path
        path: /
        target: /
      - type: path
        path: /api/*
        target: /api/*
      - type: path
        path: /static/*
        target: /static/*
    
    # Health check
    healthCheckPath: /health
    healthCheckTimeout: 10
    healthCheckInterval: 30
    
    # Auto-deploy on git push
    autoDeploy: true
    
    # Additional configuration
    maxInstances: 1
    memory: 512
