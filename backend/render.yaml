# RaheeCraft Control Panel - Render Deployment
# https://render.com/dashboard/new?type=web
#
# This file also lives at the repo root as render.yaml so Render can auto-
# detect the blueprint from GitHub. If you create the service from the UI
# instead, set Root Directory = backend and use these commands:
#   Build:  pip install -r requirements.txt
#   Start:  python app.py

services:
  - type: web
    name: raheecraft-control-panel
    env: python
    plan: free
    # Root Directory is set in the Render UI to "backend", so these commands
    # run inside backend/.
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app.py"
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8080
      - key: DEBUG
        value: false
      - key: SESSION_SECURE
        value: true
    healthCheckPath: /health
    healthCheckTimeout: 10
    healthCheckInterval: 30
    autoDeploy: true
    maxInstances: 1
    memory: 512
